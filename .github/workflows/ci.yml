name: CI

on:
  push:
    branches: ['**']
  pull_request:

# SPEC §9.3: the unit suite gates the build. `build` needs `unit`, so a red
# test suite means no artifact — not a warning next to a green tick.
jobs:
  unit:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Single-file build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # The single-file guarantee (SPEC §2.1) is a property worth asserting,
      # not just intending: dist/ must contain index.html and nothing else.
      - name: Assert the build is one self-contained file
        run: |
          set -euo pipefail
          files=$(find dist -type f | sort)
          echo "$files"
          if [ "$files" != "dist/index.html" ]; then
            echo "::error::dist/ must contain only index.html; found:"
            echo "$files"
            exit 1
          fi
          if grep -Eq '<(script|link)[^>]+(src|href)="(https?:)?//' dist/index.html; then
            echo "::error::dist/index.html references an external script or stylesheet"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: browser-agent
          path: dist/index.html

  e2e:
    name: End-to-end (mock engine)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The real-model suite is excluded by default: it needs a WebGPU device,
      # which hosted runners do not have. See scripts/model-check.js.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
