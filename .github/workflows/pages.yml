name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is not worth finishing, but never cancel one in flight —
# that can leave the Pages site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Nothing ships without the unit suite passing (SPEC §9.3).
      - run: npm run test:coverage
      - run: npm run build

      # Deliberately no `enablement: true`. Creating a Pages site needs admin
      # rights the default GITHUB_TOKEN does not have; it fails with "Resource
      # not accessible by integration" and takes the whole deploy down with it.
      # Pages has to be switched to "GitHub Actions" once, by hand, in
      # Settings → Pages → Source. The README says so.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Check what is actually live, not merely that the job reported success.
      #
      # Serving the repository root instead of the build produces a page that
      # loads and then silently does nothing: a green deploy and a dead site.
      # The two are easy to tell apart — the built artifact inlines everything
      # and runs to megabytes, while the source entry is ~3 kB and references
      # /src/main.js, which exists only during development.
      - name: Verify the deployed page is the built artifact
        run: |
          set -euo pipefail
          url='${{ steps.deployment.outputs.page_url }}'
          echo "Checking $url"

          body=$(mktemp)
          code=$(curl -sS -L --retry 5 --retry-delay 5 --retry-all-errors \
                      -o "$body" -w '%{http_code}' "$url")
          size=$(wc -c < "$body")
          echo "HTTP $code, $size bytes"

          if [ "$code" != "200" ]; then
            echo "::error::The deployed page returned HTTP $code"
            exit 1
          fi

          if grep -q 'src="/src/main.js"' "$body"; then
            echo "::error::The site is serving the unbuilt source entry point, so the app cannot start."
            echo "::error::Fix: Settings → Pages → Source must be \"GitHub Actions\", not \"Deploy from a branch\"."
            exit 1
          fi

          if [ "$size" -lt 1000000 ]; then
            echo "::error::The deployed page is only $size bytes. The built artifact inlines the whole runtime and is far larger, so this is not it."
            exit 1
          fi

          # The install files are optional to the page but are the whole of
          # the Install button and offline start-up. A host that answers them
          # with the page itself (an SPA fallback) breaks both silently.
          base="${url%/}"
          for f in manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png; do
            type=$(curl -sS -L --retry 5 --retry-delay 5 --retry-all-errors \
                        -o /dev/null -w '%{http_code} %{content_type}' "$base/$f")
            echo "$f: $type"
            case "$type" in
              200\ text/html*|200\ ) echo "::error::$f is served as HTML or untyped, so the app will not install."; exit 1 ;;
              200\ *) ;;
              *) echo "::error::$f is not being served ($type)."; exit 1 ;;
            esac
          done

          echo "The built artifact is live."
