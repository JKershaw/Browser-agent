<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Browser Agent — M1 debug</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; margin: 0; padding: 1rem; max-width: 60rem; }
      textarea { width: 100%; min-height: 4rem; font: inherit; }
      pre { background: #f4f4f5; padding: .75rem; overflow-x: auto; white-space: pre-wrap; }
      button { font: inherit; padding: .4rem .8rem; }
    </style>
  </head>
  <body>
    <h1>Browser Agent — M1 debug page</h1>
    <p>
      Bare harness for the headless core (engine interface, tool-call parser, curl tool, agent loop).
      The real UI arrives in M2. Append <code>?mockEngine=1</code> to drive it without a GPU.
    </p>
    <textarea id="input" placeholder="Ask something…"></textarea>
    <p><button id="send">Send</button> <button id="cancel">Cancel</button></p>
    <h2>Transcript</h2>
    <pre id="out"></pre>
    <h2>Request log</h2>
    <pre id="log"></pre>
    <script type="module" src="/src/debug.js"></script>
  </body>
</html>
